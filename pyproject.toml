[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-text-summarization-nlp"
version = "1.0.0"
description = "Compare extractive and abstractive text summarization with ROUGE evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SirajM92Dev"}]
dependencies = [
  "datasets>=2.18.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "rouge-score>=0.1.2",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
summarize = "summarization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
